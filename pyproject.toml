[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contributor-compass"
version = "0.4.0a0"
description = "Personalized open-source project investment recommendations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "githubkit>=0.16.1",
  "httpx>=0.28,<1",
  "Jinja2>=3.1,<4",
  "mcp>=2,<3",
  "pydantic>=2,<3",
  "pygithub>=2.10.0",
  "python-dotenv>=1.2.3",
  "selectolax>=0.4.11",
  "typer>=0.27.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
compass = "compass.controllers.cli:main"
compass-mcp = "compass.controllers.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["compass"]
